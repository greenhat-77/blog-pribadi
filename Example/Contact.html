<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IamBugass_ | Contact</title>
</head>
<body>

    <!-- Header & Navigasi -->
    <header>
        <h1><a href="index.html">IamBugass_</a></h1>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="project.html">Project</a></li>
                <li><a href="contact.html"><strong>Contact</strong></a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Talk to Me :v</h2>
            <p>Kalau kamu punya pertanyaan, pesan, atau mau jadi teman sama aku, kamu bisa isi formulir yang disediakan.           
            <p>Thanks for your messages for me :)</p>
        </section>

        <!-- Formulir Kontak -->
        <section>
            <h3>Send a messages</h3>
            <form action="#" method="post">
                <div>
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="subject">Subject</label><br>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <br>
                <div>
                    <label for="message">Comment or Message</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" required></textarea>
                </div>
                <br>
                <div>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
